name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to host
        uses: appleboy/ssh-action@v1.2.2
        env:
          SUDO_BOT_TOKEN: ${{ secrets.SUDO_BOT_TOKEN }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          envs: SUDO_BOT_TOKEN
          script: |
            set -euo pipefail
            mkdir -p /opt/indicator
            if [ ! -d /opt/indicator/.git ]; then
              git clone https://github.com/Sudomessenger/indicator.git /opt/indicator
            fi
            cd /opt/indicator
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            if [ -n "${SUDO_BOT_TOKEN:-}" ]; then
              printf 'SUDO_BOT_TOKEN=%s\n' "$SUDO_BOT_TOKEN" > /opt/indicator/.env
              chmod 600 /opt/indicator/.env
            fi
            if command -v npm >/dev/null 2>&1; then
              npm ci
              npm run build
            else
              echo "Node/npm is missing on the host"
              exit 1
            fi
            cp deploy/indicator.service /etc/systemd/system/indicator.service
            systemctl daemon-reload
            systemctl enable indicator
            systemctl restart indicator
            systemctl --no-pager --full status indicator
